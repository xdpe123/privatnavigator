name: Privatnavigator
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Privatnavigator:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.privatnavigator.app
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Privatnavigator
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Zeigt deinen Standort auf der Fahrtkarte.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [privatnavigator]
    dependencies:
      - target: ReiseWidgets
        embed: true
  ReiseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.privatnavigator.app.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Privatnavigator
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
